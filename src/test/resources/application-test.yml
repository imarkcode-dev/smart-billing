spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:smartbilling-ia}
          location: us-central1
          transport-type: rest
          credentials-location: file:/home/markcode/dev-copilot/conf/smartbilling-ia.json
          retry:
            max-attempts: 3
            back-off:
              initial-interval: 2000
              max-interval: 5000
          chat:
            options:
              model: gemini-2.5-flash
              temperature: 0.2

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

    hibernate:
      ddl-auto: create-drop

    show-sql: true